    permission: ultimatepops.admin
  upops:
    description: Abre el menu de UltimatePops (staff)
    usage: /upops
    permission: ultimatepops.admin
  pop:
    description: Abre el menu de UltimatePops (staff)
    usage: /pop
    permission: ultimatepops.admin
  totempractice:
    description: Abre el menu de UltimatePops (staff)
    usage: /totempractice
    permission: ultimatepops.admin
  poppractice:
    description: Abre el menu de UltimatePops (staff)
    usage: /poppractice
    permission: ultimatepops.admin
  ultimapops:
    description: Abre el menu de UltimatePops (staff)
    usage: /ultimapops
    permission: ultimatepops.admin

permissions:
